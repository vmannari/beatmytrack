<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beat My Track · Studio</title>
  <link rel="stylesheet" href="/admin/assets/style.css">
  <script src="/admin/assets/commerce.js" defer></script>
  <script src="/admin/assets/support.js" defer></script>
  <script src="/admin/assets/studio.js" defer></script>
  <script src="/admin/assets/product_analytics.js" defer></script>
  <script src="/admin/assets/operations.js" defer></script>
  <script src="/admin/assets/app.js" defer></script>
</head>
<body>
  <a class="studio-skip" href="#main">Skip to workspace</a>
  <aside class="sidebar" id="sidebar">
    <a class="console-brand" href="#overview"><span aria-hidden="true">╱╱</span> BEAT MY<br>TRACK.</a>
    <p class="console-label">STUDIO</p>
    <button id="close-nav" class="btn" aria-label="Close navigation">Close navigation</button>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="console-bottom"><span id="connection">Same-origin backend</span><br><small id="role">Authentication required</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button class="btn menu-toggle" id="menu" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <span class="badge" id="environment">Disconnected</span>
      <button class="btn search-trigger" id="search">Find a record <kbd>Ctrl K</kbd></button>
      <span class="spacer"></span>
      <label for="days">Window</label>
      <select id="days" aria-label="Reporting window">
        <option value="7">Last 7 days</option><option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option><option value="custom">Selected dates</option>
      </select>
      <button class="btn" id="date-range" aria-label="Choose reporting dates in UTC">Dates</button>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="logout">Lock</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>BEAT MY TRACK · Studio · UTC</span><span id="freshness"></span></footer>
  </div>
  <dialog id="dialog"></dialog>
</body>
</html>
