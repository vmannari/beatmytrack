# Apply after the matching migration/grant/backup checks; no provider changes.
services:
  api:
    environment: &cost
      BMT_OBJECT_PACKING_ENABLED: "true"
      BMT_RETENTION_DAYS: "7"
      BMT_COST_ARCHIVE_DAYS: "7"
      BMT_COST_ARCHIVE_BATCH: "500"
      BMT_HTTP_SUCCESS_SAMPLE_PER_MILLE: "10"
      BMT_HTTP_METRICS_INTERVAL_SECONDS: "60"
  worker:
    environment: *cost
  admin:
    environment: *cost
