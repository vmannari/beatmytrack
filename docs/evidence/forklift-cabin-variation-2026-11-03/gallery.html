<!doctype html><html lang="en"><meta charset="utf-8"><title>Forklift cabin frame comparison</title>
<style>body{margin:0;background:#101b23;color:#eef2ee;font:16px system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 10px}p{color:#b7c6c7}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{font:inherit;background:#25363e;color:inherit;border:1px solid #42545c;border-radius:6px;padding:8px 12px;cursor:pointer}button.active{color:#14212a;background:#e9bd59}.compare{position:relative;width:100%;aspect-ratio:4/3}img{display:block;width:100%}.compare img{position:absolute;inset:0}.after{clip-path:inset(0 0 0 50%)}.labels{display:flex;justify-content:space-between;padding:12px 0}input{width:100%;accent-color:#e9bd59}h2{font-size:21px}.overview{margin-top:40px}</style>
<main><h1>Forklift cabin frames</h1><p>Native Garage views. Drag the slider to compare the previous frame with the new construction.</p>
<div class="buttons"><button onclick="select(0)">Original</button><button onclick="select(1)">Round hoop frame</button><button onclick="select(2)">Pressed pillar frame</button><button onclick="select(3)">Rear cantilever frame</button><button onclick="select(4)">Swept frame</button><button onclick="select(5)">Barrel roof frame</button><button onclick="select(6)">Crossbeam frame</button><button onclick="select(7)">Weather canopy</button><button onclick="select(8)">Diamond roof frame</button><button onclick="select(9)">Vaulted frame</button><button onclick="select(10)">Wedge frame</button><button onclick="select(11)">Screen roof frame</button><button onclick="select(12)">Heavy duty frame</button><button onclick="select(13)">Sun shade frame</button></div><h2 id="name"></h2><p id="description"></p>
<div class="labels"><span>Previous</span><span>Updated</span></div><div class="compare"><img id="before" alt="Previous frame"><img id="after" class="after" alt="Updated frame"></div><input aria-label="Before and after divider" type="range" value="50" min="0" max="100" oninput="document.querySelector('.after').style.clipPath='inset(0 0 0 '+this.value+'%)'">
<p>Updated frame: <a style="color:#e9bd59" id="front-link">Front view</a> · <a style="color:#e9bd59" id="side-link">Side view</a></p>
<div class="overview"><h2>All updated frames</h2><p><a style="color:#e9bd59" href="front-overview.jpg">Front overview</a> · <a style="color:#e9bd59" href="side-overview.jpg">Side overview</a></p><img src="cabin-overview.jpg" alt="All fourteen cabin frames side by side"></div></main>
<script>const choices=[{"id": "stock", "name": "Original", "description": "Factory overhead guard"}, {"id": "fork_rail", "name": "Round hoop frame", "description": "Round transverse hoops joined by slim roof ties"}, {"id": "fork_plate", "name": "Pressed pillar frame", "description": "Broad tapered rear pillars and painted roof blades"}, {"id": "fork_twin", "name": "Rear cantilever frame", "description": "Twin rear goosenecks carry an open-front roof"}, {"id": "fork_canted", "name": "Swept frame", "description": "Rearward-swept pillars and a sloping longitudinal roof"}, {"id": "fork_round", "name": "Barrel roof frame", "description": "Long curved side arches carry a rounded barrel roof"}, {"id": "fork_cross", "name": "Crossbeam frame", "description": "Low roof with crossed braces and painted corner haunches"}, {"id": "fork_canopy", "name": "Weather canopy", "description": "Full overhanging painted roof with deep rain gutters"}, {"id": "fork_lattice", "name": "Diamond roof frame", "description": "Slim straight pillars beneath an open diamond roof lattice"}, {"id": "fork_arch", "name": "Vaulted frame", "description": "High transverse roof arches above low side rails"}, {"id": "fork_sport", "name": "Wedge frame", "description": "Tapered wedge roof with three broad longitudinal slats"}, {"id": "fork_mesh", "name": "Screen roof frame", "description": "Fine metal roof screen on a light alloy-coloured frame"}, {"id": "fork_heavy", "name": "Heavy duty frame", "description": "Deep painted roof rails and broad rear pillar haunches"}, {"id": "fork_safari", "name": "Sun shade frame", "description": "Extended pale front shade above an open rear roof"}];function select(i){let c=choices[i];document.querySelector('#name').textContent=c.name;document.querySelector('#description').textContent=c.description;document.querySelector('#before').src='previous/body-'+c.id+'.png';document.querySelector('#after').src='native/body-'+c.id+'.png';document.querySelector('#front-link').href='front/body-'+c.id+'.png';document.querySelector('#side-link').href='side/body-'+c.id+'.png';document.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',i===j));}select(3);</script></html>
