<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Forklift covers and guards</title>
<style>body{margin:0;background:#101b23;color:#eef2ee;font:16px system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 10px}p{color:#b7c6c7}nav,.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{font:inherit;background:#25363e;color:inherit;border:1px solid #42545c;border-radius:6px;padding:8px 12px;cursor:pointer}button.active{color:#14212a;background:#e9bd59}.compare{position:relative;width:100%;aspect-ratio:4/3}.compare img{position:absolute;inset:0;width:100%}.after{clip-path:inset(0 0 0 50%)}.labels{display:flex;justify-content:space-between;padding:12px 0}input{width:100%;accent-color:#e9bd59}h2{font-size:21px}.overview{margin-top:40px}.overview img{display:block;width:100%}</style>
<main><h1>Forklift engine covers and rear guards</h1><p>Native Garage renders. Select a category and drag the divider to compare the previous part with its new design.</p>
<nav><button id="hood" onclick="category('hood')">Engine covers</button><button id="aero" onclick="category('aero')">Rear guards</button></nav>
<div class="buttons"></div><h2 id="name"></h2><p id="description"></p>
<div class="labels"><span>Previous</span><span>Updated</span></div><div class="compare"><img id="before" alt="Previous part"><img id="after" class="after" alt="Updated part"></div><input aria-label="Before and after divider" type="range" value="50" min="0" max="100" oninput="document.querySelector('.after').style.clipPath='inset(0 0 0 '+this.value+'%)'">
<p><a style="color:#e9bd59" id="detail-link">Additional view</a></p>
<div class="overview"><h2>All updated engine covers</h2><p><a style="color:#e9bd59" href="detail-hood-overview.jpg">Lower profile views</a></p><img src="hood-overview.jpg" alt="Fourteen engine covers side by side"><h2>All updated rear guards</h2><p><a style="color:#e9bd59" href="detail-aero-overview.jpg">Straight rear views</a></p><img src="aero-overview.jpg" alt="Fourteen rear guards side by side"></div></main>
<script>const choices={"hood": [{"id": "stock", "name": "Original", "description": "Factory engine cover"}, {"id": "fork_vent", "name": "Louvre cassette", "description": "Broad recessed cooling cassette in a folded steel shell"}, {"id": "fork_rib", "name": "Cast fin cover", "description": "Nine integral cooling fins in a cast alloy shell"}, {"id": "fork_twin", "name": "Butterfly cover", "description": "Independent curved service doors with a central joint"}, {"id": "fork_scoop", "name": "Raised rear intake", "description": "Rising formed shell with a wide recessed rear intake"}, {"id": "fork_louvre", "name": "Herringbone louvres", "description": "Opposed diagonal vanes beneath a folded centre ridge"}, {"id": "fork_split", "name": "Two-piece service cover", "description": "Painted hinge shell and a separate graphite lift-out panel"}, {"id": "fork_dome", "name": "Barrel cover", "description": "Broad curved crown with narrow shoulder cooling banks"}, {"id": "fork_fan", "name": "Circular filter cover", "description": "Round filter cassette with a rolled rim and captive screws"}, {"id": "fork_cross", "name": "Captive service hatch", "description": "Chamfered removable hatch with six captive fasteners"}, {"id": "fork_flush", "name": "Flush cover", "description": "Clean low shell with a narrow rear breathing slot"}, {"id": "fork_armour", "name": "Protected shoulders", "description": "Formed cover with bolted shoulder wear plates"}, {"id": "fork_channel", "name": "Pressed flutes", "description": "Four deep longitudinal pressings in a continuous shell"}, {"id": "fork_race", "name": "Folded side vents", "description": "Creased centre crown and recessed shoulder intakes"}], "aero": [{"id": "stock", "name": "Original", "description": "Factory counterweight bumper"}, {"id": "fork_bar", "name": "Pressed impact beam", "description": "Folded steel beam with a rolled return and end cheeks"}, {"id": "fork_wrap", "name": "Wraparound guard", "description": "Continuous painted corner returns and replaceable buffers"}, {"id": "fork_twin", "name": "Twin tube rails", "description": "Separated round impact rails on substantial mounting webs"}, {"id": "fork_low", "name": "Low rubber shoe", "description": "Low moulded rubber impact shoe on a steel backing"}, {"id": "fork_bow", "name": "Swept wing guard", "description": "Continuous rising wing beam with protected outer ends"}, {"id": "fork_step", "name": "Recessed step guard", "description": "Raised impact wings around a recessed cast-tread step"}, {"id": "fork_mesh", "name": "Open service grille", "description": "Open vertical vanes within a welded steel frame"}, {"id": "fork_roller", "name": "Dock roller guard", "description": "Rubber dock rollers on captive axles and supported brackets"}, {"id": "fork_plate", "name": "Counterweight shield", "description": "Faceted painted shield with a replaceable lower rubber face"}, {"id": "fork_cage", "name": "Braced box guard", "description": "Open box frame with diagonal braces and corner pads"}, {"id": "fork_arc", "name": "Rolled steel tube", "description": "Broad curved round tube held by mounting saddles"}, {"id": "fork_rib", "name": "Triple dock buffers", "description": "Three moulded ribbed pads on a recessed carrier rail"}, {"id": "fork_tow", "name": "Clevis towing guard", "description": "Bored twin clevis ears and a captive vertical towing pin"}]};let current='hood';function category(c){current=c;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id===c));const buttons=document.querySelector('.buttons');buttons.replaceChildren();choices[c].forEach((choice,i)=>{let b=document.createElement('button');b.textContent=choice.name;b.onclick=()=>select(i);buttons.append(b);});select(1);}function select(i){let c=choices[current][i];document.querySelector('#name').textContent=c.name;document.querySelector('#description').textContent=c.description;document.querySelector('#before').src='before-native/'+current+'-'+c.id+'.png';document.querySelector('#after').src='native/'+current+'-'+c.id+'.png';document.querySelector('#detail-link').href='detail/'+current+'-'+c.id+'.png';document.querySelector('#detail-link').textContent=current==='hood'?'Lower profile view':'Straight rear view';document.querySelectorAll('.buttons button').forEach((b,j)=>b.classList.toggle('active',i===j));}category('hood');</script></html>
