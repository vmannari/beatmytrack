<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garage · native review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1118;color:#edf0ed;font:16px system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}p{color:#a8bac5;margin:0 0 24px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}label{display:flex;align-items:center;gap:8px}select,button{color:inherit;background:#182832;border:1px solid #44565f;border-radius:6px;padding:12px;font:inherit}button{cursor:pointer}button.active{border-color:#ffd348;color:#ffd348}figure{margin:0}img{width:100%;height:auto;display:block;border:1px solid #36444c;border-radius:8px}figcaption{margin:12px 0;color:#a8bac5}a{color:#ffd348}
</style><main><h1>Garage</h1><p>Actual engine captures · washing, paint and fitted parts</p><div class="controls">
<label>View <select id="view"><option value="care">Car washing</option><option value="customise">Customisation</option><option value="colours">Paint colours</option><option value="stickers">Stickers</option><option value="tuning">Tuning</option></select></label>
<label>Size <select id="width"><option>1280</option><option>960</option><option>1600</option></select></label>
<label>Renderer <select id="renderer"><option value="gl_compatibility">Compatibility</option><option value="mobile">Desktop Mobile</option></select></label>
<button id="before">Before</button><button id="after" class="active">After</button><button id="app" class="active">Show App navigation</button>
</div><figure><img id="capture" alt="Garage menu native screenshot"><figcaption id="caption"></figcaption></figure><p><a href="../../../docs/GARAGE_STUDIO_POLISH_2026_10_24.md">Change and validation record</a> · <a href="report.json">Evidence and hashes</a></p></main>
<script>
let before=false,app=true;const get=id=>document.getElementById(id);
function draw(){const view=get('view').value,width=get('width').value,renderer=get('renderer').value;const hasApp=['care','customise','tuning'].includes(view);get('before').classList.toggle('active',before);get('after').classList.toggle('active',!before);get('app').classList.toggle('active',app);get('app').disabled=before||!hasApp;const folder=before?'test_garage_studio_polish-gl_compatibility-baseline':'test_garage_studio_polish-'+renderer;const prefix=!before&&app&&hasApp?'app-':'';get('capture').src=folder+'/'+prefix+view+'-'+width+'.png';get('caption').textContent=(before?'Before · Compatibility':('After · '+get('renderer').selectedOptions[0].text))+' · '+width+' × '+(width==='960'?'540':'720')+(prefix?' · full App':' · Garage workspace');}
for(const id of ['view','width','renderer'])get(id).onchange=draw;get('before').onclick=()=>{before=true;draw()};get('after').onclick=()=>{before=false;draw()};get('app').onclick=()=>{app=!app;draw()};draw();
</script></html>
