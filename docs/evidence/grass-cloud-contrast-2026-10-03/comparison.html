<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grass sunlight and cloud shade</title>
<style>
body{margin:24px;background:#172129;color:#edf1f3;font:16px system-ui}main{max-width:1494px;margin:auto}label{display:inline-block;margin:12px 16px 12px 0}select,input{font:inherit;accent-color:#f0cb52}figure{position:relative;margin:0;overflow:hidden}img{display:block;width:100%;height:auto}#after{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}#divider{position:absolute;inset:0 auto 0 50%;width:2px;background:#f0cb52}input{width:min(90vw,650px)}p{color:#b9c5ca}
</style>
<main><h1>Grass sunlight and cloud shade</h1><p>Before on the left, revised lighting on the right. Drag the divider to compare identical desktop views.</p>
<label>View <select id="view"><option value="starter-view-3">Sunny bend</option><option value="starter-view-9">Cloud and sunlight transition</option><option value="starter-view-6">Road view</option><option value="starter">Start line</option><option value="gameplay">Bridge gameplay</option><option value="clouds-0s">Cloud overview (diagnostic camera)</option></select></label>
<label>Divider <input id="slider" aria-label="Before and after divider" type="range" min="0" max="100" value="50"></label>
<figure><img id="before" src="before/starter-view-3.png" alt="Original grass lighting"><img id="after" src="after/starter-view-3.png" alt="Revised grass lighting"><span id="divider"></span></figure>
<p>Scripted, paused desktop captures. Existing countdown and HUD retained. Phone and owner visual acceptance remain outstanding.</p></main>
<script>
const slider=document.querySelector('#slider'),view=document.querySelector('#view'),after=document.querySelector('#after'),before=document.querySelector('#before'),divider=document.querySelector('#divider');
slider.oninput=()=>{after.style.clipPath=`inset(0 0 0 ${slider.value}%)`;divider.style.left=slider.value+'%'};
view.onchange=()=>{before.src='before/'+view.value+'.png';after.src='after/'+view.value+'.png'};
</script></html>
