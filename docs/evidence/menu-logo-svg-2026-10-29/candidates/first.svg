<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="536" viewBox="0 0 1800 536">
  <title>Beat My Track</title>
  <desc>Clean vector reconstruction of the owner-supplied racing logo. The B mark and the two-line wordmark both span y=8 to y=528.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffdc43"/>
      <stop offset="1" stop-color="#ffcc24"/>
    </linearGradient>
    <path id="letter-b" fill-rule="evenodd" d="M0 0H98Q142 0 142 45V61Q142 85 125 98Q148 111 148 145V153Q148 200 98 200H0ZM58 45V79H80Q90 79 90 66V59Q90 45 80 45ZM58 120V155H82Q94 155 94 140V135Q94 120 82 120Z"/>
    <path id="letter-e" d="M0 0H130V46H58V78H115V121H58V154H130V200H0Z"/>
    <path id="letter-a" fill-rule="evenodd" d="M0 200 50 0H110L160 200H104L96 164H54L46 200ZM64 120H86L75 64Z"/>
    <path id="letter-t" d="M0 0H150V46H104V200H46V46H0Z"/>
    <path id="letter-m" d="M0 200V0H55L90 80 125 0H180V200H126V100L106 154H74L54 100V200Z"/>
    <path id="letter-y" d="M0 0H57L82 70 107 0H164L111 124V200H53V124Z"/>
    <path id="letter-r" fill-rule="evenodd" d="M0 200V0H102Q150 0 150 52V78Q150 114 119 130L157 200H94L58 124V200ZM58 45V88H83Q94 88 94 75V58Q94 45 83 45Z"/>
    <path id="letter-c" d="M150 80H93V55Q93 45 83 45H65Q55 45 55 55V145Q55 155 65 155H83Q93 155 93 145V120H150V157Q150 200 105 200H45Q0 200 0 155V45Q0 0 45 0H105Q150 0 150 43Z"/>
    <path id="letter-k" d="M0 0H58V75L104 0H168L105 100 174 200H109L58 124V200H0Z"/>
  </defs>
  <!-- Three continuous ribbons retain the original swept B silhouette. -->
  <g id="b-mark" fill="url(#gold)" transform="translate(8 8) scale(1 1.04)">
    <path d="M80 0H485C532 0 557 16 589 49L635 98C676 141 673 194 631 232C691 271 704 333 676 397C649 459 590 500 515 500H376L481 384C547 312 565 256 538 192C514 136 466 85 408 77H139Z"/>
    <path d="M149 95H335C416 95 473 138 486 199C500 264 463 314 415 363L278 500H157L340 320C399 264 419 222 391 174C380 155 362 139 340 128H207Z"/>
    <path d="M149 95H310C367 95 404 120 425 155C446 192 433 229 402 256L122 500H0L258 242H375C396 242 407 231 407 215C407 199 393 185 371 185H208Z"/>
  </g>
  <!-- Outlined lettering: no font installation or embedded bitmap is needed. -->
  <g id="wordmark" transform="translate(758 8) skewX(-4)" fill="#f5f3eb">
    <g transform="scale(1.05 1.2)">
      <use href="#letter-b"/>
      <use href="#letter-e" x="164"/>
      <use href="#letter-a" x="304"/>
      <use href="#letter-t" x="464"/>
      <g fill="url(#gold)">
        <use href="#letter-m" x="650"/>
        <use href="#letter-y" x="836"/>
      </g>
    </g>
    <g transform="translate(0 260) scale(1.259 1.3)">
      <use href="#letter-t"/>
      <use href="#letter-r" x="160"/>
      <use href="#letter-a" x="325"/>
      <use href="#letter-c" x="495"/>
      <use href="#letter-k" x="660"/>
    </g>
  </g>
</svg>
