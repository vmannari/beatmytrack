<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smooth meadow relief</title>
<style>
body{margin:0;padding:24px;background:#172025;color:#edf0e7;font:16px system-ui,sans-serif}main{max-width:1494px;margin:auto}h1{font-size:24px}p{color:#bcc8c8}a{color:#e9c75b}label{display:inline-flex;gap:12px;margin:12px 24px 20px 0;align-items:center}select,input{font:inherit;accent-color:#e9c75b}.pair{position:relative;overflow:hidden}.pair img{width:100%;display:block}.before{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#e9c75b}.tag{position:absolute;top:12px;padding:6px 10px;background:#172025dd}.old{left:12px}.new{right:12px}
</style>
<main><h1>Smooth meadow relief</h1><p>Kit 105 before; kit 106 after. Road, kerbs and sand shoulder remain flat. Drag to compare.</p>
<label>View <select id="view"><option value="gameplay">Gameplay</option><option value="corner">Corner</option></select></label>
<label>Divider <input id="slider" type="range" min="0" max="100" value="50" aria-label="Before/after divider"></label>
<div class="pair"><img id="after" src="gameplay-after.png" alt="Off-road terrain with smooth mounds"><div class="before"><img id="before" src="gameplay-before.png" alt="Flat terrain baseline"></div><div class="divider"></div><span class="tag old">Before</span><span class="tag new">After</span></div>
<p><a href="offroad-gameplay.png">Car on a mound at the production camera</a> · <a href="offroad-detail.png">Closer terrain/contact inspection</a> · <a href="../../OFFROAD_RELIEF.md">Actual tests and acceptance limits</a></p></main>
<script>
document.querySelector('#slider').addEventListener('input',event=>{document.querySelector('.before').style.clipPath=`inset(0 ${100-event.target.value}% 0 0)`;document.querySelector('.divider').style.left=`${event.target.value}%`;});
document.querySelector('#view').addEventListener('change',event=>{document.querySelector('#before').src=`${event.target.value}-before.png`;document.querySelector('#after').src=`${event.target.value}-after.png`;});
</script></html>
