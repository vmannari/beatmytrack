<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volt rear window — native before and after</title>
<style>
body{margin:24px;background:#151b22;color:#eef1f5;font:16px system-ui}
h1{font-size:24px}label{display:inline-block;margin:12px 0}select{font:inherit;padding:6px}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%;display:block}figcaption{padding:8px 0}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
<h1>Volt rear window</h1>
<p>Rear glass moved about 16 cm backwards, with fitted roof and rear pillars. These are native game renders.</p>
<label>View <select id="view"><option value="full-rear-quarter">Rear quarter</option><option value="full-side">Side</option><option value="full-rear-low">Low rear</option><option value="full-top">Top</option><option value="garage-rear-clean">Garage</option><option value="simple-rear-quarter">Simpler race model</option></select></label>
<main><figure><figcaption>Before</figcaption><img id="before" src="before-compatibility/full-rear-quarter.png" alt="Volt before the window move"></figure><figure><figcaption>After</figcaption><img id="after" src="after-compatibility/full-rear-quarter.png" alt="Volt with the rear window moved backwards"></figure></main>
<script>
document.querySelector('#view').onchange=e=>{for(const stage of ['before','after'])document.querySelector('#'+stage).src=stage+'-compatibility/'+e.target.value+'.png'};
</script>
