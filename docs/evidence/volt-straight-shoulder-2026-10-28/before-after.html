<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volt cabin correction — native comparison</title>
<style>body{margin:24px;background:#151b22;color:#eef1f5;font:16px system-ui}h1{font-size:24px}select{font:inherit;padding:6px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:12px 0}img{width:100%;display:block}figcaption{padding:8px 0}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<h1>Volt body and cabin correction</h1><p>Windshield moved 20 cm forwards with adapted cabin, bonnet, mirrors and doors; fixed rear quarter glass removed. Native Garage renders; wear is synthetic test data.</p>
<label>Before set <select id="baseline"><option value="windscreen-before">Before windshield move (v19)</option><option value="before">Before cabin corrections (v17)</option></select></label>
<label>View <select id="view"><option value="side-clean">Side, clean</option><option value="front-quarter-clean">Front cabin, clean</option><option value="front-pillar-clean">Front pillar, close</option><option value="rear-quarter-clean">Rear glass, clean</option><option value="rear-low-clean">Low rear, clean</option><option value="side-worn">Side, worn</option><option value="rear-quarter-worn">Rear glass, worn</option></select></label>
<main><figure><figcaption>Before</figcaption><img id="before" src="windscreen-before/side-clean.png" alt="Previous Volt cabin"></figure><figure><figcaption>After</figcaption><img id="after" src="preview/side-clean.png" alt="Corrected Volt cabin"></figure></main>
<script>function refresh(){const view=document.querySelector('#view').value;document.querySelector('#before').src=document.querySelector('#baseline').value+'/'+view+'.png';document.querySelector('#after').src='preview/'+view+'.png'}document.querySelector('#view').onchange=refresh;document.querySelector('#baseline').onchange=refresh;</script>
