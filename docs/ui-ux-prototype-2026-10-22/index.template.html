<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Beat My Track · Interactive menu concept</title>
  <meta name="description" content="A self-contained, interactive design proposal for Beat My Track. Sample data; no connection to the game or its services.">
  <style>__CSS__</style>
  <!-- Embedded font license:
__FONT_LICENSE__
  -->
</head>
<body>
  <header class="reviewbar" aria-label="Prototype review controls">
    <div class="review-brand"><span class="concept-dot"></span><strong>MENU CONCEPT <span>01</span></strong><small>Interactive proposal · sample data</small></div>
    <div class="review-controls">
      <label class="sr-only" for="jump">Jump to a screen</label>
      <select id="jump" aria-label="Jump to a screen">
        <option value="welcome">First launch</option><option value="race">Free race</option><option value="rivalry">Weekly Rivalry</option><option value="challenges">Challenges</option><option value="challenge-create">Create challenge · A/B/C</option><option value="garage">Garage</option><option value="trophies">Trophy Room</option><option value="create">Create</option><option value="settings">Settings</option><option value="results">Race results</option><option value="store">Store</option><option value="profile">Profile</option>
      </select>
      <button data-action="walkthrough" class="review-button">Try a journey</button>
      <button data-action="before" class="review-button" id="before-button">Current screen</button>
      <button data-action="notes" class="review-button" aria-pressed="false" id="notes-button">Design notes</button>
      <button data-action="reset-demo" class="review-button icon-only" aria-label="Restart the prototype" title="Restart the prototype">↺</button>
    </div>
  </header>
  <main class="workspace">
    <div class="stage-wrap">
      <div class="stage-meta"><span id="screen-label">01 / FIRST LAP</span><div class="scenario-tools"><label for="scenario">Scenario</label><select id="scenario"><option value="online">Connected</option><option value="offline">Offline</option><option value="error">Service error</option><option value="empty">No search matches</option></select><button id="finish-preview" data-action="finish-race" hidden>Finish race preview →</button></div></div>
      <div id="challenge-review" hidden aria-label="Compare challenge creation concepts"></div>
      <section id="game" class="game" aria-label="Interactive game menu proposal"></section>
      <footer class="prototype-footer"><span>Built with the game’s existing artwork and fonts. All times and players are examples.</span><span>Click to explore <span class="footer-dot">·</span> Esc goes back</span></footer>
    </div>
    <aside id="design-notes" class="design-notes" hidden aria-label="Design notes"></aside>
  </main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <svg id="asset-sprite" width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"></svg>
  <script>const ASSETS = __ASSETS__;

const CHALLENGE_ENTRY = false;
__CHALLENGE_JS__
const CHALLENGE_FOCUS = false;

  </script>
</body>
</html>
