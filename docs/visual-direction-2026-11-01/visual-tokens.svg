<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Beat my track — proposed visual tokens</title>
  <desc id="description">A proposed palette and examples of a consistent menu and racing HUD. This is design reference material, not game UI.</desc>
  <rect width="1600" height="1200" fill="#091722"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="60" width="8" height="56" rx="4" fill="#FFD646"/>
    <text x="92" y="77" fill="#ADC1CC" font-size="17" font-weight="700" letter-spacing="3">BEAT MY TRACK / VISUAL DIRECTION</text>
    <text x="92" y="117" fill="#F2F5F5" font-size="42" font-weight="700">A shared visual language</text>
    <text x="92" y="151" fill="#ADC1CC" font-size="20">Tactile miniature motorsport · clear at racing scale</text>
    <rect x="1230" y="64" width="306" height="43" rx="21.5" fill="#102331" stroke="#345264"/>
    <text x="1383" y="91" text-anchor="middle" fill="#ADC1CC" font-size="16">Design proposal · not game UI</text>

    <text x="64" y="218" fill="#FFD646" font-size="15" font-weight="700" letter-spacing="2">01 / COLOUR</text>
    <text x="64" y="250" fill="#F2F5F5" font-size="25" font-weight="700">A quiet foundation, one clear action</text>
    <text x="1536" y="249" fill="#ADC1CC" font-size="16" text-anchor="end">Proposed values · sRGB</text>

    <g font-size="17">
      <g transform="translate(64 276)"><rect width="190" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="170" height="67" rx="7" fill="#091722" stroke="#345264"/><text x="12" y="99" fill="#F2F5F5" font-weight="700">Canvas</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#091722</text></g>
      <g transform="translate(277 276)"><rect width="190" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="170" height="67" rx="7" fill="#102331" stroke="#345264"/><text x="12" y="99" fill="#F2F5F5" font-weight="700">Surface</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#102331</text></g>
      <g transform="translate(490 276)"><rect width="190" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="170" height="67" rx="7" fill="#345264"/><text x="12" y="99" fill="#F2F5F5" font-weight="700">Border</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#345264</text></g>
      <g transform="translate(703 276)"><rect width="190" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="170" height="67" rx="7" fill="#F2F5F5"/><text x="12" y="99" fill="#F2F5F5" font-weight="700">Text</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#F2F5F5</text></g>
      <g transform="translate(916 276)"><rect width="190" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="170" height="67" rx="7" fill="#ADC1CC"/><text x="12" y="99" fill="#F2F5F5" font-weight="700">Secondary</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#ADC1CC</text></g>
      <g transform="translate(1129 276)"><rect width="190" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="170" height="67" rx="7" fill="#FFD646"/><text x="12" y="99" fill="#F2F5F5" font-weight="700">Action</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#FFD646</text></g>
      <g transform="translate(1342 276)"><rect width="194" height="126" rx="12" fill="#102331" stroke="#345264"/><rect x="10" y="10" width="174" height="67" rx="7" fill="#FFD646"/><text x="97" y="53" text-anchor="middle" fill="#091722" font-size="18" font-weight="700">Aa</text><text x="12" y="99" fill="#F2F5F5" font-weight="700">On action</text><text x="12" y="118" fill="#ADC1CC" font-size="15">#091722</text></g>
    </g>

    <text x="64" y="465" fill="#FFD646" font-size="15" font-weight="700" letter-spacing="2">02 / HIERARCHY</text>
    <text x="64" y="497" fill="#F2F5F5" font-size="25" font-weight="700">Every screen answers: where am I, what matters, what next?</text>
    <rect x="64" y="520" width="650" height="211" rx="14" fill="#102331" stroke="#345264"/>
    <text x="88" y="552" fill="#ADC1CC" font-size="15" font-weight="700" letter-spacing="1">TRACK OF THE DAY</text>
    <text x="88" y="594" fill="#F2F5F5" font-size="31" font-weight="700">Your next challenge</text>
    <text x="88" y="628" fill="#ADC1CC" font-size="19">One clear objective and supporting context.</text>
    <rect x="88" y="648" width="214" height="55" rx="9" fill="#FFD646"/>
    <text x="195" y="682" text-anchor="middle" fill="#091722" font-size="20" font-weight="700">Race</text>
    <rect x="319" y="648" width="185" height="55" rx="9" fill="#102331" stroke="#345264"/>
    <text x="411" y="682" text-anchor="middle" fill="#F2F5F5" font-size="19">View details</text>
    <text x="750" y="554" fill="#F2F5F5" font-size="20" font-weight="700">Primary text</text>
    <text x="750" y="581" fill="#ADC1CC" font-size="17">Headlines and essential values use the lightest tone.</text>
    <text x="750" y="622" fill="#F2F5F5" font-size="20" font-weight="700">Secondary text</text>
    <text x="750" y="649" fill="#ADC1CC" font-size="17">Context stays quieter, but remains readable.</text>
    <text x="750" y="690" fill="#F2F5F5" font-size="20" font-weight="700">One primary action</text>
    <text x="750" y="717" fill="#ADC1CC" font-size="17">Yellow means a decision or selected state, not decoration.</text>

    <text x="64" y="794" fill="#FFD646" font-size="15" font-weight="700" letter-spacing="2">03 / CONSISTENCY</text>
    <text x="64" y="826" fill="#F2F5F5" font-size="25" font-weight="700">The same family, from menu to race</text>
    <rect x="64" y="848" width="700" height="250" rx="14" fill="#102331" stroke="#345264"/>
    <text x="88" y="882" fill="#ADC1CC" font-size="15" font-weight="700" letter-spacing="1">MENU / SELECTED MODE</text>
    <rect x="88" y="904" width="260" height="66" rx="10" fill="#091722" stroke="#FFD646" stroke-width="2"/>
    <rect x="88" y="904" width="6" height="66" rx="3" fill="#FFD646"/>
    <circle cx="124" cy="937" r="15" fill="#FFD646"/>
    <path d="M117 937l5 5 9-11" fill="none" stroke="#091722" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="153" y="944" fill="#F2F5F5" font-size="21" font-weight="700">Daily</text>
    <rect x="364" y="904" width="240" height="66" rx="10" fill="#091722" stroke="#345264"/>
    <circle cx="400" cy="937" r="15" fill="none" stroke="#ADC1CC" stroke-width="2"/>
    <text x="429" y="944" fill="#ADC1CC" font-size="21">Free race</text>
    <text x="88" y="1017" fill="#F2F5F5" font-size="18" font-weight="700">Selected: label + check + outline</text>
    <text x="88" y="1047" fill="#ADC1CC" font-size="17">State never relies on colour alone.</text>

    <rect x="784" y="848" width="752" height="250" rx="14" fill="#102331" stroke="#345264"/>
    <text x="808" y="882" fill="#ADC1CC" font-size="15" font-weight="700" letter-spacing="1">RACE / SIMPLE HUD SURFACES</text>
    <rect x="808" y="904" width="160" height="76" rx="12" fill="#091722" stroke="#345264"/>
    <text x="826" y="929" fill="#ADC1CC" font-size="14">LAP</text><text x="826" y="960" fill="#F2F5F5" font-size="25" font-weight="700">1 / 5</text>
    <rect x="985" y="904" width="235" height="76" rx="12" fill="#091722" stroke="#345264"/>
    <text x="1003" y="929" fill="#ADC1CC" font-size="14">TIME</text><text x="1003" y="960" fill="#F2F5F5" font-size="25" font-weight="700">00:32.480</text>
    <circle cx="1270" cy="942" r="38" fill="#091722" stroke="#ADC1CC" stroke-width="2"/>
    <path d="M1279 926l-16 16 16 16" fill="none" stroke="#F2F5F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1365" cy="942" r="38" fill="#091722" stroke="#ADC1CC" stroke-width="2"/>
    <path d="M1356 926l16 16-16 16" fill="none" stroke="#F2F5F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="808" y="1017" fill="#F2F5F5" font-size="18" font-weight="700">Quiet controls leave the car and road in focus.</text>
    <text x="808" y="1047" fill="#ADC1CC" font-size="17">Final sizes, contrast over scenery and touch placement need device testing.</text>

    <line x1="64" y1="1140" x2="1536" y2="1140" stroke="#345264"/>
    <text x="64" y="1172" fill="#ADC1CC" font-size="15">PROPOSED TOKENS · CONCEPT EXAMPLES · NOT IMPLEMENTATION SPECIFICATIONS</text>
    <text x="1536" y="1172" fill="#ADC1CC" font-size="15" text-anchor="end">01 NOV 2026</text>
  </g>
</svg>
