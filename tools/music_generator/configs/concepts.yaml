model: mrt2_base
duration: 24
output_dir: build/music/raw/concepts

identity: >
  Original instrumental background score for a stylish top-down racing game.
  Organic, hand-played and melodic. Warm, focused and slightly defiant.
  Quiet confidence grows into exhilaration. Memorable musical identity from the first phrase.

global_positive:
  - natural human performance
  - real acoustic drum kit when drums are present
  - real electric or acoustic guitar
  - melodic bass guitar
  - tasteful piano or organ only when useful
  - clear phrasing with anticipation and resolution
  - background-score balance rather than foreground concert performance
  - classic and alternative rock energy without copying a specific artist
  - moderate syncopation and human microtiming
  - dynamics and breathing room

global_negative:
  - EDM
  - techno
  - synthwave
  - four-on-the-floor electronic beat
  - electronic bass drops
  - risers
  - generic corporate rock
  - repetitive one-bar ostinato
  - constant eighth-note guitar chugging
  - intrusive virtuoso soloing
  - vocals

concepts:
  - name: open_horizon
    prompt: >
      Begin with a complete restrained clean-electric-guitar theme that is pleasant by itself:
      a clear statement, a related answer, a small departure and a return.
      The pulse is implied, not hammered.
      Gradually reveal melodic bass, restrained acoustic drums and wider guitar harmony.
      The climax is the same opening identity sounding confident and expansive, not an unrelated lead.

  - name: moving_light
    prompt: >
      A slightly melancholic but optimistic melodic idea on intimate piano with sparse clean-guitar responses.
      Natural rests and held tones. No empty random notes.
      Build toward understated alternative-rock motion using bass and acoustic drums,
      then let the original motif return in a broader emotionally satisfying form.

  - name: road_memory
    prompt: >
      Roots-rock influenced but modern game-score restraint.
      Start with fingerpicked or lightly picked guitar presenting a memorable motif over changing harmony.
      Avoid campfire-song cliché and blues-rock noodling.
      Develop into a confident road-going groove with melodic bass, acoustic drums and subtle organ,
      ending with a strong but non-aggressive thematic payoff.

  - name: quiet_voltage
    prompt: >
      Darker alternative-rock colour without becoming ominous.
      Spacious clean electric guitar establishes a distinctive motif,
      with harmonic tension and release rather than constant rhythmic repetition.
      Later add bass, roomy acoustic drums and restrained overdriven guitar.
      Final section should feel like flow-state concentration and speed.
