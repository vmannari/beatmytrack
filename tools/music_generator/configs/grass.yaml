model: mrt2_base
duration: 20
variants_per_state: 3
output_dir: build/music/raw/grass

composition_family: open_horizon

identity: >
  Original instrumental adaptive racing soundtrack for the Grass biome.
  Warm open-air alternative/classic-rock palette, natural instruments and human performance.
  Every state must feel like the same composition and preserve the same central melodic identity.

global_positive:
  - melodic clean electric guitar
  - warm bass guitar
  - acoustic drums
  - subtle piano or organ
  - moderate syncopation
  - natural dynamics
  - memorable phrase architecture
  - music stays behind engine and tyre sounds
  - optimistic with slight emotional depth
  - smooth transitions and no hard drops

global_negative:
  - EDM
  - synthwave
  - electronic drum kit
  - trap percussion
  - metal
  - punk-speed drumming
  - shredding
  - constant ostinato
  - generic trailer music
  - vocals

states:
  - name: 00_focus
    prompt: >
      Lowest intensity. One primary instrument carries a COMPLETE musical idea.
      Restrained clean electric guitar with enough harmonic implication to stand alone.
      Clear statement-answer-development-return phrasing, natural pauses, sustained tones,
      gentle rhythmic shape, no drums and no obvious metronomic accompaniment.
      This must remain enjoyable even if it plays for an entire race.

  - name: 01_momentum
    prompt: >
      Same motif and harmonic personality as Focus.
      Add a warm sparse melodic bass foundation and slightly more forward guitar phrasing.
      Still no full drum groove. Keep substantial space and preserve concentration.

  - name: 02_drive
    prompt: >
      Same composition, now with a restrained natural acoustic-drum pulse.
      Human kick, snare and hat pattern with moderate syncopation rather than mechanical repetition.
      Bass becomes more purposeful. Guitar motif remains identifiable and has space.

  - name: 03_flow
    prompt: >
      Confident driving state.
      Broaden harmony with rhythm guitar and optional subtle piano or organ.
      Drums support forward motion without dominating.
      Develop the opening motif rather than replacing it.

  - name: 04_lift
    prompt: >
      Same thematic identity approaching payoff.
      Increase melodic range and harmonic openness.
      Add tasteful counterline or upper-guitar voice and slightly stronger drum articulation.
      Create anticipation for a resolution without cinematic risers or electronic effects.

  - name: 05_breakthrough
    prompt: >
      Full clean-streak payoff.
      The original opening theme returns clearly in its most confident form.
      Wider guitars, melodic bass, full natural acoustic drums and subtle harmonic support.
      Energetic and exhilarating but still background music suitable for precise racing.
      The payoff must feel earned through thematic continuity, not merely louder or denser.
