model: mrt2_base
duration: 16
variants_per_state: 2
output_dir: build/music/raw/reference_arc_r2
composition_family: night_signal_r2
identity: Original instrumental driving score. No singing.
states:
  - name: r2_00_focus
    prompt: >
      Intimate atmospheric indie folk. Gentle melancholy with a hopeful rising melodic answer.
      Spacious half-time feel over a 120 BPM straight pulse, D minor.
      A memorable short melody, breathing pauses, suspended harmony. No full drum beat.
    variant_prompts:
      - Fingerpicked electric guitar carries a delicate melodic question. Soft distant organ and warm bass swells answer.
      - Muted felt piano carries a delicate melodic question. Airy sustained guitar and soft low strings answer.
  - name: r2_01_momentum
    prompt: >
      Earthy roots rock, relaxed but moving. Warm bass and dry acoustic drums find a deep pocket.
      A short minor-key guitar melody ends with an optimistic rising answer.
      120 BPM straight groove, D minor. Space between phrases, instrumental.
    variant_prompts:
      - Clean twangy electric guitar plays clipped melodic answers over a round walking bass figure and rim-click drums.
      - Warm slightly gritty electric guitar plays spacious syncopated answers over a firm bass groove and soft snare.
  - name: r2_02_drive
    prompt: >
      Confident southern hard rock instrumental. Tight live drums, muscular bass and warm guitar grit.
      A tuneful short riff alternates with a rising melodic answer. 120 BPM straight groove, D minor.
      Human articulation, compact phrases, room for the melody.
    variant_prompts:
      - Two electric guitars trade concise melodic phrases; one gritty rhythm guitar, one clean answering guitar. Solid laid-back pocket.
      - A low crunchy guitar riff locks to a melodic bass line. Brief harmonized guitar replies and a steady open-road drum groove.
  - name: r2_03_flow
    prompt: >
      Hook-driven melodic punk and new-wave rock instrumental. Crisp forward backbeat,
      purposeful bass, short ringing guitar chords. A clear minor-key hook with an upward answer.
      120 BPM straight pulse, D minor. Energetic articulation, no frantic soloing.
    variant_prompts:
      - Brisk palm-muted guitar verses open into bright ringing chords. Punchy snare and singing single-note guitar melody.
      - Tight syncopated bass and dry drums drive chiming guitars and a concise keyboard countermelody. Cool, buoyant urgency.
  - name: r2_04_lift
    prompt: >
      Dramatic alternative rock instrumental, gathering tension before a melodic resolution.
      Strong bass-riff relationship, taut live drums, widening guitar harmony.
      Rising melodic sequence over D minor at 120 BPM. Controlled space, no electronic riser.
    variant_prompts:
      - A powerful low guitar riff supports a sustained ascending lead melody, with octave bass and an expectant held chord.
      - Piano octaves and a dark melodic bass line rise beneath broad guitar chords and a restrained luminous synth answer.
  - name: r2_05_breakthrough
    prompt: >
      Triumphant melodic arena-rock instrumental. A distinctive original rising anthem hook,
      clear statement and answering resolution. Broad chords, melodic bass and confident acoustic drums.
      D minor opening towards F major, 120 BPM. Exhilarating but spacious.
    variant_prompts:
      - Warm brass-like analog synthesizer carries a bold memorable fanfare, answered by harmonized electric guitars. No quoted song melody.
      - A soaring harmonized guitar melody carries the anthem, with luminous keyboard chords and a broad uplifting melodic answer.
